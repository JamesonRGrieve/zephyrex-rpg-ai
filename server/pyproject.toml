[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex-rpg-ai"
version = "0.1.0"
description = "Zephyrex RPG AI: AI characters and a GM that play inside the wiki's world and at the VTT's table"
requires-python = ">=3.11"
dependencies = [
    # AI characters are genealogy persons (ai_character.person_id). The
    # framework's public 0.0.x releases on PyPI.
    "zephyrex[genealogy]~=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]
