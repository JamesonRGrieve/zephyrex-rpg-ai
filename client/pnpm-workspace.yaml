# Playwright 1.63's typed responses import zod; declare it as playwright-core's
# peer so pnpm resolves it (otherwise e2e response types silently become any).
packageExtensions:
  playwright-core:
    peerDependencies:
      zod: '*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  # postinstall only prints a funding banner
  core-js: false
  core-js-pure: true
  esbuild: true
  prisma: true
  # ships prebuilt @img/* binaries; the install script is a build-from-source fallback
  sharp: false
  unrs-resolver: true

# The Zephyrex packages are not on a registry yet (publishing needs operator
# approval), so resolve them from the sibling checkouts' compiled dist/. They are
# injected (hard-linked copies, peers resolved from this app) via
# package.json dependenciesMeta, so there is one React/Next/zod tree.
overrides:
  # The runners carry the browser build Playwright 1.63 drives (chromium 1243), not 1.65's (1255):
  # hold every copy, the Storybook test-runner's included, at the e2e suite's pin.
  playwright: 1.63.0
  playwright-core: 1.63.0
  zephyrex: file:../../client-framework/packages/zephyrex
  '@zephyrex/auth': file:../../auth
  '@zephyrex/auth-magic-link': file:../../client-framework/packages/auth-magic-link
  '@zephyrex/lite': file:../../client-framework/packages/lite
  '@zephyrex/marketing': file:../../client-framework/packages/marketing
  '@jgrieve/forms': file:../../dynamic-form
  zod2gql: file:../../zod2gql
  # The suite (docs/SUITE.md; the operator, 2026-11-21: "ai-rpg imports both separately"): the
  # wiki's pages from the pinned wiki checkout (WIKI_REF; deploy/compile-wiki.sh builds its dist
  # against this app's dependencies) and the VTT's play UI from the pinned VTT checkout (VTT_REF;
  # source-only, transpiled by Next).
  '@zephyrex-rpg/wiki': file:../../zephyrex-rpg-wiki/client/packages/wiki
  '@zephyrex/vtt-play': file:../../zephyrex-vtt/client/packages/vtt-play
