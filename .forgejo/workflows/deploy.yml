# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds Zephyrex RPG AI from main and places it on prod-zephyrex-rpg. Every step runs in a fresh
# container from the pinned image; the runner host provides nothing but podman. The framework
# repositories come from GitHub at the commits deploy/frameworks.env pins.
# Until launch it never starts anything (deploy/ship.sh): the app stays disabled until the
# pre-launch network security audit passes (operator, 2026-11-04).
name: Deploy

# Run by hand only until prod-zephyrex-rpg is up and the RC is approved: Infra Architect builds it (CT 60007)
# and a push before then would try to place onto a missing guest. Put the
# push trigger back once the guest is up.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod-zephyrex-rpg
  cancel-in-progress: false

jobs:
  deploy:
    # A Zephyrex Forgejo runner's size tier (SOP CI Runners: the smallest a job runs on). A Next
    # build and the server bundle take the normal tier (5–8 vCPU); a fresh container per job.
    runs-on: normal
    container:
      # node:24-trixie: Node 24 on Debian 13, the CT's release (the image Cule's deploy pins).
      image: docker.io/library/node@sha256:611b2e34ec1dd43a7bd4a334f146be7b0b51e8827acb86f94ca4c078cc53bba5
    timeout-minutes: 60
    env:
      UV_VERSION: 0.11.16
      PNPM_VERSION: 11.1.1
      WORKSPACE_ROOT: /tmp/zephyrex-rpg-build
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Check out Zephyrex RPG AI
        uses: https://code.forgejo.org/actions/checkout@v4

      # The runner network may have no IPv6 egress, while Debian's mirrors and npm answer AAAA
      # first: apt is told to use IPv4, and Node to prefer it.
      - name: Install the toolchain
        run: |
          echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends rsync openssh-client curl ca-certificates git >/dev/null
          npm install -g "pnpm@${PNPM_VERSION}" >/dev/null
          curl -LsSf --ipv4 "https://astral.sh/uv/${UV_VERSION}/install.sh" | env UV_INSTALL_DIR=/usr/local/bin sh

      - name: Fetch the frameworks
        run: deploy/fetch-frameworks.sh "$WORKSPACE_ROOT"

      - name: Build the server
        run: deploy/build-server.sh "$WORKSPACE_ROOT" "$WORKSPACE_ROOT/out/server"

      - name: Build the client
        run: |
          set -a
          . deploy/deploy.env
          set +a
          deploy/build-client.sh "$WORKSPACE_ROOT" "$WORKSPACE_ROOT/out/client"

      - name: Place on prod-zephyrex-rpg
        env:
          # The key is the one secret; where to deploy and the pinned host key are variables.
          RPG_AI_DEPLOY_KEY: ${{ secrets.RPG_AI_DEPLOY_KEY }}
          RPG_AI_DEPLOY_KNOWN_HOSTS: ${{ vars.RPG_AI_DEPLOY_KNOWN_HOSTS }}
          RPG_AI_DEPLOY_HOST: ${{ vars.RPG_AI_DEPLOY_HOST }}
          RPG_AI_DEPLOY_USER: ${{ vars.RPG_AI_DEPLOY_USER }}
        run: deploy/ship.sh "$WORKSPACE_ROOT/out/server" "$WORKSPACE_ROOT/out/client"
